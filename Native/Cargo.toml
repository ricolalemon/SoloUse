[package]
name = "solouse-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { path = "vendor/idevice", default-features = false, features = ["ring", "remote_pairing", "tcp", "tunnel_tcp_stack", "display_stream", "xctest"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
plist = "1"
libc = "0.2"
sha2 = "0.10.9"
futures-util = "0.3"
hmac = "0.12"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
